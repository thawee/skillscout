name: Skillscout
options:
  bundleIdPrefix: com.thawee
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  Skillscout:
    type: application
    platform: macOS
    sources:
      - Skillscout
      - path: registry.json
        buildPhase: resources
    dependencies:
      - target: SkillscoutCLI
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: "Quartermaster"
        PRODUCT_BUNDLE_IDENTIFIER: com.thawee.quartermaster
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Quartermaster"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  SkillscoutCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Skillscout/Models.swift
      - Skillscout/SkillScanner.swift
      - Skillscout/SkillSimilarity.swift
      - Skillscout/PromptLibrary.swift
      - Skillscout/PromptLibrary+Tools.swift
      - Skillscout/SkillInstaller.swift
      - Skillscout/SkillActions.swift
      - Skillscout/UsageReport.swift
      - Skillscout/UsageReportCache.swift
      - Skillscout/SkillDetailInspection.swift
      - Skillscout/RepositoryLibrary.swift
      - Skillscout/RepositoryMerge.swift
      - Skillscout/RepositoryUpdate.swift
      - Skillscout/RepositoryUpdateImpact.swift
      - Skillscout/ProjectLibrary.swift
      - Skillscout/ProjectSkillInstaller.swift
      - Skillscout/SkillsetInstaller.swift
      - Skillscout/SkillVersions.swift
      - Skillscout/Analyzer.swift
      - Skillscout/AIEngine.swift
      - Skillscout/Registry.swift
      - Skillscout/SkillsDirectory.swift
      - Skillscout/SkillReview.swift
      - Skillscout/SkillsetTransfer.swift
      - Skillscout/PluginScanner.swift
    settings:
      base:
        PRODUCT_NAME: quartermaster
        PRODUCT_BUNDLE_IDENTIFIER: com.thawee.quartermaster.cli
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  SkillscoutTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Skillscout/Models.swift
      - Skillscout/SkillScanner.swift
      - Skillscout/SkillSimilarity.swift
      - Skillscout/PromptLibrary.swift
      - Skillscout/PromptLibrary+Tools.swift
      - Skillscout/SkillInstaller.swift
      - Skillscout/SkillActions.swift
      - Skillscout/UsageReport.swift
      - Skillscout/UsageReportCache.swift
      - Skillscout/SkillDetailInspection.swift
      - Skillscout/RepositoryLibrary.swift
      - Skillscout/RepositoryMerge.swift
      - Skillscout/RepositoryUpdate.swift
      - Skillscout/RepositoryUpdateImpact.swift
      - Skillscout/ProjectLibrary.swift
      - Skillscout/ProjectSkillInstaller.swift
      - Skillscout/SkillsetInstaller.swift
      - Skillscout/SkillVersions.swift
      - Skillscout/Analyzer.swift
      - Skillscout/AIEngine.swift
      - Skillscout/Registry.swift
      - Skillscout/SkillsDirectory.swift
      - Skillscout/SkillReview.swift
      - Skillscout/SkillsetTransfer.swift
      - Skillscout/PluginScanner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thawee.quartermaster.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - SkillscoutTests
