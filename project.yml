name: Skillscout
options:
  bundleIdPrefix: com.thawee
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Skillscout:
    type: application
    platform: macOS
    sources:
      - Skillscout
      - path: registry.json
        buildPhase: resources
    dependencies:
      - target: SkillscoutCLI
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: "Skillscout Mod"
        PRODUCT_BUNDLE_IDENTIFIER: com.thawee.skillscout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Skillscout Mod"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  SkillscoutCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Skillscout/Models.swift
      - Skillscout/SkillScanner.swift
      - Skillscout/SkillSimilarity.swift
      - Skillscout/PromptLibrary.swift
      - Skillscout/PromptLibrary+Tools.swift
      - Skillscout/SkillInstaller.swift
      - Skillscout/SkillsetInstaller.swift
      - Skillscout/Analyzer.swift
      - Skillscout/AIEngine.swift
      - Skillscout/Registry.swift
    settings:
      base:
        PRODUCT_NAME: skillscout-mod
        PRODUCT_BUNDLE_IDENTIFIER: com.thawee.skillscout.cli
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
